<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pulse — Modern Social & Live Channels</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0B0E14; }
    ::-webkit-scrollbar-thumb { background: #222838; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }
  </style>
</head>
<body class="bg-[#0B0E14] text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center selection:bg-emerald-500 selection:text-white">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center p-4 w-full">
    <div class="bg-[#121620] border border-[#222838] p-8 rounded-3xl w-full max-w-sm shadow-2xl relative overflow-hidden">
      <div class="absolute -top-16 -right-16 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
      <div class="flex items-center gap-2 mb-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-black text-slate-950 text-base shadow-lg shadow-emerald-500/20">P</div>
        <h1 class="text-2xl font-black tracking-tight text-white">Pulse<span class="text-emerald-400">.</span></h1>
      </div>
      <p class="text-xs text-slate-400 mb-6">Real-time dev spaces, channels & feed</p>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-semibold uppercase text-slate-400 tracking-wider">Email</label>
          <input id="authEmail" type="email" placeholder="dev@pulse.app" class="mt-1 w-full px-3.5 py-2.5 bg-[#181E2C] border border-[#2B3347] rounded-xl text-sm outline-none focus:border-emerald-500 text-white transition placeholder-slate-500" />
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase text-slate-400 tracking-wider">Password</label>
          <input id="authPass" type="password" placeholder="••••••••" class="mt-1 w-full px-3.5 py-2.5 bg-[#181E2C] border border-[#2B3347] rounded-xl text-sm outline-none focus:border-emerald-500 text-white transition placeholder-slate-500" />
        </div>
      </div>

      <div class="flex gap-2.5 mt-6">
        <button onclick="handleAuth('login')" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl font-bold text-sm shadow-lg shadow-emerald-500/25 transition">Log In</button>
        <button onclick="handleAuth('signup')" class="flex-1 py-2.5 bg-[#181E2C] hover:bg-[#202738] border border-[#2B3347] rounded-xl font-bold text-sm transition">Sign Up</button>
      </div>
      <p id="authMsg" class="text-xs text-center mt-3 text-amber-400 min-h-[16px]"></p>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="mainApp" class="hidden w-full max-w-4xl flex-1 flex flex-col min-h-screen border-x border-[#1C2230]">
    
    <!-- Top Navbar -->
    <header class="w-full border-b border-[#1C2230] px-4 py-3 flex items-center justify-between sticky top-0 bg-[#0B0E14]/90 backdrop-blur-md z-30">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-black text-slate-950 text-sm shadow-md shadow-emerald-500/20">P</div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-white text-base tracking-tight">Pulse</span>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded font-mono">v2.0</span>
          </div>
          <p id="navSubtext" class="text-[11px] text-slate-400 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="userBadge"></span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openCreateRoomModal()" class="px-2.5 py-1.5 bg-[#181E2C] hover:bg-[#222A3D] border border-[#2B3347] rounded-lg text-xs font-semibold flex items-center gap-1.5 text-emerald-400">
          <span>+</span> Room
        </button>
        <button onclick="logout()" class="px-2.5 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-semibold transition">
          Exit
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-[#1C2230] bg-[#0E121A] text-xs font-bold uppercase tracking-wider">
      <button id="tabChatBtn" onclick="switchTab('chat')" class="flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400 flex items-center justify-center gap-2">
        <span>💬</span> Live Channels & Rooms
      </button>
      <button id="tabFeedBtn" onclick="switchTab('feed')" class="flex-1 py-3 text-center text-slate-400 hover:text-white border-b-2 border-transparent flex items-center justify-center gap-2">
        <span>⚡</span> Community Feed
      </button>
    </div>

    <!-- VIEW 1: LIVE ROOMS & CHANNELS -->
    <div id="chatView" class="flex-1 flex flex-col md:flex-row overflow-hidden h-[calc(100vh-105px)]">
      <!-- Rooms Sidebar -->
      <aside class="w-full md:w-64 border-b md:border-b-0 md:border-r border-[#1C2230] bg-[#0E121A]/60 p-3 flex md:flex-col gap-2 overflow-x-auto md:overflow-y-auto">
        <div class="hidden md:flex items-center justify-between px-2 py-1 mb-1">
          <span class="text-[11px] font-bold uppercase text-slate-500 tracking-wider">Channels</span>
        </div>
        <div id="roomListContainer" class="flex md:flex-col gap-1.5 w-full"></div>
      </aside>

      <!-- Active Chat Area -->
      <main class="flex-1 flex flex-col bg-[#0B0E14] overflow-hidden">
        <!-- Room Header -->
        <div class="px-4 py-2.5 border-b border-[#1C2230] bg-[#10141D] flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-slate-400 font-mono text-base">#</span>
            <span id="activeRoomTitle" class="font-bold text-sm text-white capitalize">general</span>
          </div>
          <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">Live Sync</span>
        </div>

        <!-- Messages Stream -->
        <div id="messagesBox" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <!-- Active Reply Preview Bar -->
        <div id="replyPreviewBar" class="hidden px-4 py-2 bg-[#141924] border-t border-[#222838] flex items-center justify-between text-xs">
          <div class="flex items-center gap-2 truncate">
            <span class="text-emerald-400 font-bold">Replying to <span id="replyUserLabel"></span>:</span>
            <span id="replyTextLabel" class="text-slate-400 truncate max-w-xs italic"></span>
          </div>
          <button onclick="cancelReply()" class="text-slate-400 hover:text-white font-bold px-2 py-0.5">✕</button>
        </div>

        <!-- Chat Input Bar -->
        <div class="p-3 bg-[#0E121A] border-t border-[#1C2230]">
          <div class="flex gap-2 items-center bg-[#151B27] border border-[#262E42] rounded-2xl px-3 py-1.5 focus-within:border-emerald-500 transition">
            <input id="chatInput" type="text" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Message in channel... (type @ to tag)" class="w-full bg-transparent text-sm text-white placeholder-slate-500 outline-none py-1.5" />
            <div class="flex items-center gap-1">
              <button onclick="insertEmoji('🔥')" class="text-sm p-1 hover:bg-[#202738] rounded">🔥</button>
              <button onclick="insertEmoji('🚀')" class="text-sm p-1 hover:bg-[#202738] rounded">🚀</button>
              <button onclick="sendChatMessage()" class="ml-1 px-3.5 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl transition">Send</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- VIEW 2: FEED -->
    <main id="feedView" class="hidden p-4 space-y-4 flex-1 max-w-2xl mx-auto w-full">
      <!-- Post Composer -->
      <div class="bg-[#121620] border border-[#222838] rounded-2xl p-4 shadow-xl">
        <textarea id="postContent" placeholder="What's your latest tech update or thought?" class="w-full bg-transparent text-sm text-white resize-none outline-none h-20 placeholder-slate-500"></textarea>
        <div class="flex items-center justify-between pt-3 border-t border-[#1F2535]">
          <div class="flex gap-1.5 text-xs text-slate-400">
            <button onclick="addHashtag('#build')" class="px-2 py-0.5 bg-[#181E2C] rounded-md hover:text-emerald-400">#build</button>
            <button onclick="addHashtag('#showcase')" class="px-2 py-0.5 bg-[#181E2C] rounded-md hover:text-emerald-400">#showcase</button>
            <button onclick="addHashtag('#bug')" class="px-2 py-0.5 bg-[#181E2C] rounded-md hover:text-emerald-400">#bug</button>
          </div>
          <button onclick="publishPost()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-xl transition shadow-lg shadow-emerald-500/20">Publish Pulse</button>
        </div>
      </div>
      <div id="postsList" class="space-y-3"></div>
    </main>
  </div>

  <!-- CREATE ROOM MODAL -->
  <div id="createRoomModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-[#121620] border border-[#222838] p-6 rounded-2xl w-full max-w-sm shadow-2xl">
      <h3 class="text-base font-bold text-white mb-1">Create Custom Room</h3>
      <p class="text-xs text-slate-400 mb-4">Enter a clean room slug (e.g. backend-crew, ai-tools)</p>
      <input id="newRoomInput" type="text" placeholder="room-name" class="w-full p-2.5 bg-[#181E2C] border border-[#2B3347] rounded-xl text-sm outline-none focus:border-emerald-500 text-white mb-4" />
      <div class="flex gap-2">
        <button onclick="closeCreateRoomModal()" class="flex-1 py-2 bg-[#181E2C] hover:bg-[#202738] rounded-xl text-xs font-bold">Cancel</button>
        <button onclick="confirmCreateRoom()" class="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl text-xs font-bold">Create & Join</button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = "https://tynoyujftmziutiytgsa.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5bm95dWpmdG16aXV0aXl0Z3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjE3MzQsImV4cCI6MjEwNjIzNzczNH0.71VfM08bzaxu__Idm3sp00VHzly9CSss9WwA-l5Fd5g";
    const sb = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = null;
    let currentRoom = "general";
    let chatChannel = null;
    let activeReply = null;

    let availableRooms = ["general", "dev-chat", "showcase", "random", "bugs-help"];

    async function init() {
      // Check stored custom rooms
      const savedRooms = localStorage.getItem("pulse_custom_rooms");
      if (savedRooms) {
        try {
          const parsed = JSON.parse(savedRooms);
          availableRooms = Array.from(new Set([...availableRooms, ...parsed]));
        } catch (e) {}
      }
      checkSession();
    }

    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        showApp();
      } else {
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("mainApp").classList.add("hidden");
      }
    }

    async function handleAuth(type) {
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPass").value.trim();
      const msg = document.getElementById("authMsg");

      if (!email || !password) {
        msg.innerText = "Email aur password fill karo!";
        return;
      }
      msg.innerText = "Authenticating...";

      try {
        let res = type === 'signup' 
          ? await sb.auth.signUp({ email, password })
          : await sb.auth.signInWithPassword({ email, password });

        if (res.error) throw res.error;
        if (res.data?.user) {
          currentUser = res.data.user;
          msg.innerText = "";
          showApp();
        }
      } catch (err) {
        msg.innerText = err.message;
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.reload();
    }

    function showApp() {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      const name = currentUser.email.split('@')[0];
      document.getElementById("userBadge").innerText = `@${name}`;

      renderRoomList();
      joinChatRoom(currentRoom);
      loadPosts();
      setupRealtimePosts();
    }

    function switchTab(tab) {
      const feed = document.getElementById("feedView");
      const chat = document.getElementById("chatView");
      const feedBtn = document.getElementById("tabFeedBtn");
      const chatBtn = document.getElementById("tabChatBtn");

      if (tab === 'feed') {
        feed.classList.remove("hidden");
        chat.classList.add("hidden");
        feedBtn.className = "flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400 flex items-center justify-center gap-2";
        chatBtn.className = "flex-1 py-3 text-center text-slate-400 hover:text-white border-b-2 border-transparent flex items-center justify-center gap-2";
      } else {
        feed.classList.add("hidden");
        chat.classList.remove("hidden");
        chatBtn.className = "flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400 flex items-center justify-center gap-2";
        feedBtn.className = "flex-1 py-3 text-center text-slate-400 hover:text-white border-b-2 border-transparent flex items-center justify-center gap-2";
      }
    }

    // --- ROOM LOGIC ---
    function renderRoomList() {
      const container = document.getElementById("roomListContainer");
      container.innerHTML = availableRooms.map(r => `
        <button onclick="joinChatRoom('${r}')" class="px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 whitespace-nowrap transition ${currentRoom === r ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:bg-[#181E2C] hover:text-slate-200'}">
          <span class="text-slate-500">#</span>
          <span>${r}</span>
        </button>
      `).join('');
    }

    function openCreateRoomModal() {
      document.getElementById("createRoomModal").classList.remove("hidden");
      document.getElementById("newRoomInput").focus();
    }
    function closeCreateRoomModal() {
      document.getElementById("createRoomModal").classList.add("hidden");
    }
    function confirmCreateRoom() {
      const name = document.getElementById("newRoomInput").value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '-');
      if (!name) return;
      if (!availableRooms.includes(name)) {
        availableRooms.push(name);
        localStorage.setItem("pulse_custom_rooms", JSON.stringify(availableRooms));
      }
      closeCreateRoomModal();
      document.getElementById("newRoomInput").value = "";
      renderRoomList();
      joinChatRoom(name);
    }

    // --- CHAT & REPLIES ---
    async function joinChatRoom(room) {
      currentRoom = room;
      cancelReply();
      document.getElementById("activeRoomTitle").innerText = room;
      renderRoomList();

      const box = document.getElementById("messagesBox");
      box.innerHTML = `<div class="text-[11px] text-center text-slate-500 py-3">Joined #${room}. Messages are encrypted & live synced.</div>`;

      const { data } = await sb.from('messages').select('*').eq('room_id', room).order('created_at', { ascending: true }).limit(80);
      if (data) {
        data.forEach(m => appendChatMessage(m));
      }

      if (chatChannel) sb.removeChannel(chatChannel);

      chatChannel = sb.channel(`room-${room}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${room}` }, payload => {
          appendChatMessage(payload.new);
        }).subscribe();
    }

    function parseMessageContent(raw) {
      try {
        const parsed = JSON.parse(raw);
        if (typeof parsed === 'object' && parsed.text) return parsed;
      } catch (e) {}
      return { text: raw, reply: null };
    }

    function appendChatMessage(m) {
      const box = document.getElementById("messagesBox");
      const isMe = m.user_email === currentUser.email;
      const sender = m.user_email?.split('@')[0] || 'dev';
      const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const parsed = parseMessageContent(m.message);

      const msgEl = document.createElement("div");
      msgEl.className = `flex flex-col group ${isMe ? 'items-end' : 'items-start'} transition-all`;

      let replyQuoteHtml = '';
      if (parsed.reply) {
        replyQuoteHtml = `
          <div class="mb-1 text-[11px] px-2.5 py-1 bg-black/30 border-l-2 border-emerald-400 rounded text-slate-400 flex items-center gap-1.5">
            <span class="text-emerald-400 font-semibold font-mono">↳ @${parsed.reply.user}:</span>
            <span class="truncate max-w-[180px] italic">${parsed.reply.text}</span>
          </div>
        `;
      }

      // Format mentions
      let formattedText = parsed.text.replace(/@([a-zA-Z0-9_-]+)/g, '<span class="text-emerald-400 font-bold bg-emerald-500/10 px-1 rounded">@$1</span>');

      msgEl.innerHTML = `
        <div class="flex items-center gap-2 mb-0.5 px-1">
          <button onclick="mentionUser('${sender}')" class="text-[11px] font-bold text-slate-400 hover:text-emerald-400 transition">@${sender}</button>
          <span class="text-[9px] text-slate-600 font-mono">${time}</span>
        </div>
        <div class="relative max-w-sm sm:max-w-md">
          <div class="px-3.5 py-2 rounded-2xl text-xs ${isMe ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-tr-none' : 'bg-[#181E2C] border border-[#2B3347] text-slate-200 rounded-tl-none'} shadow-md">
            ${replyQuoteHtml}
            <div class="leading-relaxed break-words">${formattedText}</div>
          </div>
          <!-- Quick Actions on Message -->
          <div class="absolute -bottom-2 ${isMe ? 'left-0' : 'right-0'} opacity-0 group-hover:opacity-100 flex items-center gap-1 bg-[#10141D] border border-[#2B3347] px-1.5 py-0.5 rounded-full shadow-lg transition">
            <button onclick="startReply('${sender}', \`${parsed.text.replace(/`/g, '\\`')}\`)" title="Reply" class="text-[11px] text-slate-400 hover:text-emerald-400 px-1">↩ Reply</button>
            <button onclick="quickReact('${sender}')" title="Mention" class="text-[11px] text-slate-400 hover:text-white px-1">@</button>
          </div>
        </div>
      `;
      box.appendChild(msgEl);
      box.scrollTop = box.scrollHeight;
    }

    function mentionUser(sender) {
      const inp = document.getElementById("chatInput");
      inp.value = `@${sender} ` + inp.value;
      inp.focus();
    }

    function startReply(sender, text) {
      activeReply = { user: sender, text: text.substring(0, 50) };
      document.getElementById("replyUserLabel").innerText = `@${sender}`;
      document.getElementById("replyTextLabel").innerText = `"${text.substring(0, 45)}..."`;
      document.getElementById("replyPreviewBar").classList.remove("hidden");
      document.getElementById("chatInput").focus();
    }

    function cancelReply() {
      activeReply = null;
      document.getElementById("replyPreviewBar").classList.add("hidden");
    }

    function insertEmoji(emoji) {
      const inp = document.getElementById("chatInput");
      inp.value += emoji;
      inp.focus();
    }

    async function sendChatMessage() {
      const inp = document.getElementById("chatInput");
      const text = inp.value.trim();
      if (!text) return;

      const payload = {
        text: text,
        reply: activeReply
      };

      inp.value = "";
      cancelReply();

      await sb.from('messages').insert([{
        room_id: currentRoom,
        user_email: currentUser.email,
        message: JSON.stringify(payload)
      }]);
    }

    // --- FEED & POSTS ---
    function addHashtag(tag) {
      const el = document.getElementById("postContent");
      el.value = el.value + " " + tag;
      el.focus();
    }

    async function loadPosts() {
      const { data } = await sb.from('posts').select('*').order('created_at', { ascending: false }).limit(25);
      renderPosts(data || []);
    }

    function renderPosts(posts) {
      const list = document.getElementById("postsList");
      if (posts.length === 0) {
        list.innerHTML = `<div class="text-xs text-center text-slate-500 py-10">No pulse yet. Be the first to share an update!</div>`;
        return;
      }
      list.innerHTML = posts.map(p => {
        const sender = p.user_email?.split('@')[0] || 'dev';
        const time = new Date(p.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const likes = p.likes || 0;
        let formatted = p.content.replace(/#([a-zA-Z0-9_-]+)/g, '<span class="text-emerald-400 font-semibold">#$1</span>');

        return `
          <article class="bg-[#121620] border border-[#222838] p-4 rounded-2xl shadow-md hover:border-[#2F374C] transition">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs uppercase">${sender[0]}</div>
                <div>
                  <span class="text-xs font-bold text-white hover:underline cursor-pointer" onclick="mentionUser('${sender}')">@${sender}</span>
                  <span class="text-[10px] text-slate-500 block font-mono">${time}</span>
                </div>
              </div>
              <button onclick="likePost(${p.id}, ${likes})" class="flex items-center gap-1.5 px-2.5 py-1 bg-[#181E2C] hover:bg-[#202738] border border-[#2B3347] rounded-xl text-xs font-semibold text-slate-300 hover:text-rose-400 transition">
                <span>❤️</span> <span>${likes}</span>
              </button>
            </div>
            <p class="text-sm text-slate-200 leading-relaxed break-words">${formatted}</p>
          </article>
        `;
      }).join('');
    }

    async function publishPost() {
      const txt = document.getElementById("postContent").value.trim();
      if (!txt) return;
      await sb.from('posts').insert([{ content: txt, user_email: currentUser.email, likes: 0 }]);
      document.getElementById("postContent").value = "";
      loadPosts();
    }

    async function likePost(id, currentLikes) {
      await sb.from('posts').update({ likes: currentLikes + 1 }).eq('id', id);
      loadPosts();
    }

    function setupRealtimePosts() {
      sb.channel('realtime-feed')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
          loadPosts();
        }).subscribe();
    }

    window.onload = init;
  </script>
</body>
</html>
