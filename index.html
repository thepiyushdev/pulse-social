<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse — Live Social & Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center">

  <!-- AUTH SCREEN (Login / Signup) -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center p-4 w-full">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-sm shadow-xl">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-white">Pulse<span class="text-emerald-400">.</span></h1>
        <p class="text-xs text-slate-400 mt-1">Real-time developer community</p>
      </div>
      <input id="authEmail" type="email" placeholder="name@domain.com" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-lg text-sm mb-3 outline-none focus:border-emerald-500 text-white" />
      <input id="authPass" type="password" placeholder="••••••••" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-lg text-sm mb-4 outline-none focus:border-emerald-500 text-white" />
      <div class="flex gap-2">
        <button onclick="handleAuth('login')" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold text-sm transition">Log In</button>
        <button onclick="handleAuth('signup')" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg font-semibold text-sm transition">Sign Up</button>
      </div>
      <p id="authMsg" class="text-xs text-center mt-3 text-amber-400 min-h-[16px]"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" class="hidden w-full max-w-2xl flex-1 flex flex-col">
    <!-- Navbar -->
    <header class="w-full border-b border-slate-800/80 p-4 flex items-center justify-between sticky top-0 bg-slate-950/80 backdrop-blur z-10">
      <div class="flex items-center gap-2">
        <span class="text-xl font-bold tracking-tight text-white">Pulse<span class="text-emerald-400">.</span></span>
        <span id="userBadge" class="text-[11px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full border border-slate-700"></span>
      </div>
      <button onclick="logout()" class="text-xs text-rose-400 hover:text-rose-300 border border-rose-900/50 bg-rose-950/20 px-2.5 py-1 rounded-lg">Logout</button>
    </header>

    <!-- Tabs -->
    <div class="flex border-b border-slate-800 text-sm font-medium">
      <button id="tabFeedBtn" onclick="switchTab('feed')" class="flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400">Feed</button>
      <button id="tabChatBtn" onclick="switchTab('chat')" class="flex-1 py-3 text-center text-slate-400 hover:text-white">Live Rooms</button>
    </div>

    <!-- VIEW 1: FEED -->
    <main id="feedView" class="p-4 space-y-4 flex-1">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
        <textarea id="postContent" placeholder="What are you building today?" class="w-full bg-transparent text-sm text-white resize-none outline-none h-16"></textarea>
        <div class="flex justify-end pt-2 border-t border-slate-800">
          <button onclick="publishPost()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold rounded-lg transition">Publish</button>
        </div>
      </div>
      <div id="postsList" class="space-y-3"></div>
    </main>

    <!-- VIEW 2: REAL-TIME CHAT -->
    <main id="chatView" class="hidden p-4 flex-1 flex flex-col">
      <div class="flex items-center gap-2 mb-3">
        <input id="roomInput" type="text" value="general" placeholder="Room ID..." class="p-2 bg-slate-900 border border-slate-800 rounded-lg text-xs flex-1 outline-none text-white" />
        <button onclick="changeRoom()" class="px-3 py-2 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-xs rounded-lg font-medium">Join Room</button>
      </div>

      <div id="messagesBox" class="flex-1 min-h-[350px] max-h-[450px] overflow-y-auto bg-slate-900/50 border border-slate-800 rounded-xl p-3 space-y-2"></div>

      <div class="mt-3 flex gap-2">
        <input id="chatInput" type="text" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Type a live message..." class="flex-1 p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm outline-none focus:border-emerald-500 text-white" />
        <button onclick="sendChatMessage()" class="px-4 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-semibold">Send</button>
      </div>
    </main>
  </div>

  <script>
    // HARDCODED SUPABASE CREDENTIALS
    const SB_URL = "https://tynoyujftmziutiytgsa.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5bm95dWpmdG16aXV0aXl0Z3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjE3MzQsImV4cCI6MjEwNjIzNzczNH0.71VfM08bzaxu__Idm3sp00VHzly9CSss9WwA-l5Fd5g";

    const sb = supabase.createClient(SB_URL, SB_KEY);
    let currentUser = null;
    let currentRoom = "general";
    let chatChannel = null;

    async function init() {
      checkSession();
    }

    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        showApp();
      } else {
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("mainApp").classList.add("hidden");
      }
    }

    async function handleAuth(type) {
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPass").value.trim();
      const msg = document.getElementById("authMsg");
      
      if (!email || !password) {
        msg.innerText = "Email aur password dono daalo.";
        return;
      }
      
      msg.innerText = "Processing...";

      try {
        let res;
        if (type === 'signup') {
          res = await sb.auth.signUp({ email, password });
          if (res.error) throw res.error;
          msg.innerText = "Sign up successful! Agar email verification on hai toh inbox check karo ya Log In karo.";
        } else {
          res = await sb.auth.signInWithPassword({ email, password });
          if (res.error) throw res.error;
        }

        if (res.data?.user && type === 'login') {
          currentUser = res.data.user;
          msg.innerText = "";
          showApp();
        }
      } catch (err) {
        msg.innerText = err.message;
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.reload();
    }

    function showApp() {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      document.getElementById("userBadge").innerText = currentUser.email.split('@')[0];
      loadPosts();
      setupRealtimePosts();
      joinChatRoom("general");
    }

    function switchTab(tab) {
      const feed = document.getElementById("feedView");
      const chat = document.getElementById("chatView");
      const feedBtn = document.getElementById("tabFeedBtn");
      const chatBtn = document.getElementById("tabChatBtn");

      if (tab === 'feed') {
        feed.classList.remove("hidden");
        chat.classList.add("hidden");
        feedBtn.className = "flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400";
        chatBtn.className = "flex-1 py-3 text-center text-slate-400 hover:text-white";
      } else {
        feed.classList.add("hidden");
        chat.classList.remove("hidden");
        chatBtn.className = "flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400";
        feedBtn.className = "flex-1 py-3 text-center text-slate-400 hover:text-white";
      }
    }

    // --- FEED LOGIC ---
    async function loadPosts() {
      const { data, error } = await sb.from('posts').select('*').order('created_at', { ascending: false }).limit(20);
      if (!error && data) {
        renderPosts(data);
      }
    }

    function renderPosts(posts) {
      const list = document.getElementById("postsList");
      if (posts.length === 0) {
        list.innerHTML = `<div class="text-xs text-center text-slate-500 py-6">Abhi koi post nahi hai. Pehli post tum karo!</div>`;
        return;
      }
      list.innerHTML = posts.map(p => `
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
          <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
            <span class="font-medium text-emerald-400">@${p.user_email?.split('@')[0] || 'dev'}</span>
            <span>${new Date(p.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
          <p class="text-sm text-slate-200">${p.content}</p>
        </div>
      `).join('');
    }

    async function publishPost() {
      const txt = document.getElementById("postContent").value.trim();
      if (!txt) return;
      await sb.from('posts').insert([{ content: txt, user_email: currentUser.email }]);
      document.getElementById("postContent").value = "";
      loadPosts();
    }

    function setupRealtimePosts() {
      sb.channel('realtime-posts')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, () => {
          loadPosts();
        }).subscribe();
    }

    // --- REALTIME CHAT ROOMS ---
    async function joinChatRoom(room) {
      currentRoom = room;
      const box = document.getElementById("messagesBox");
      box.innerHTML = `<div class="text-[11px] text-center text-slate-500 py-2">Connected to room #${room}</div>`;

      const { data } = await sb.from('messages').select('*').eq('room_id', room).order('created_at', { ascending: true }).limit(50);
      if (data) {
        data.forEach(m => appendChatMessage(m));
      }

      if (chatChannel) sb.removeChannel(chatChannel);

      chatChannel = sb.channel(`room-${room}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${room}` }, payload => {
          appendChatMessage(payload.new);
        }).subscribe();
    }

    function changeRoom() {
      const r = document.getElementById("roomInput").value.trim() || 'general';
      joinChatRoom(r);
    }

    function appendChatMessage(m) {
      const box = document.getElementById("messagesBox");
      const isMe = m.user_email === currentUser.email;
      const el = document.createElement("div");
      el.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      el.innerHTML = `
        <span class="text-[10px] text-slate-400 px-1">${m.user_email?.split('@')[0] || 'user'}</span>
        <div class="px-3 py-1.5 rounded-xl text-xs max-w-xs ${isMe ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-200'}">
          ${m.message}
        </div>
      `;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    async function sendChatMessage() {
      const inp = document.getElementById("chatInput");
      const text = inp.value.trim();
      if (!text) return;
      inp.value = "";
      await sb.from('messages').insert([{
        room_id: currentRoom,
        user_email: currentUser.email,
        message: text
      }]);
    }

    window.onload = init;
  </script>
</body>
</html>
