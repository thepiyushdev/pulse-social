<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pulse — Ultimate Dev Social & Real-time Space</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #090D14; }
    ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 9999px; }
    .pulse-glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-[#080B10] text-slate-100 min-h-screen font-sans flex flex-col items-center selection:bg-emerald-500 selection:text-white">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center p-4 w-full">
    <div class="bg-[#0F141E] border border-[#1E2638] p-8 rounded-3xl w-full max-w-sm shadow-2xl relative overflow-hidden">
      <div class="flex items-center gap-2.5 mb-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-black text-slate-950 text-base shadow-lg shadow-emerald-500/20">P</div>
        <h1 class="text-2xl font-black tracking-tight text-white">Pulse<span class="text-emerald-400">.</span></h1>
      </div>
      <p class="text-xs text-slate-400 mb-6">Realtime Audio/Video, Channels & Dev Feed</p>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-semibold uppercase text-slate-400">Email</label>
          <input id="authEmail" type="email" placeholder="dev@pulse.app" class="mt-1 w-full px-3.5 py-2.5 bg-[#161C2A] border border-[#252E42] rounded-xl text-sm outline-none focus:border-emerald-500 text-white" />
        </div>
        <div>
          <label class="text-[11px] font-semibold uppercase text-slate-400">Password</label>
          <input id="authPass" type="password" placeholder="••••••••" class="mt-1 w-full px-3.5 py-2.5 bg-[#161C2A] border border-[#252E42] rounded-xl text-sm outline-none focus:border-emerald-500 text-white" />
        </div>
      </div>

      <div class="flex gap-2.5 mt-6">
        <button onclick="handleAuth('login')" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl font-bold text-sm transition">Log In</button>
        <button onclick="handleAuth('signup')" class="flex-1 py-2.5 bg-[#161C2A] hover:bg-[#1E2638] border border-[#252E42] rounded-xl font-bold text-sm transition">Sign Up</button>
      </div>
      <p id="authMsg" class="text-xs text-center mt-3 text-amber-400 min-h-[16px]"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" class="hidden w-full max-w-5xl flex-1 flex flex-col min-h-screen border-x border-[#161C28]">
    
    <!-- Top Navbar -->
    <header class="w-full border-b border-[#161C28] px-4 py-3 flex items-center justify-between sticky top-0 bg-[#080B10]/90 backdrop-blur-md z-30">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-black text-slate-950 text-sm">P</div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-white text-base tracking-tight">Pulse OS</span>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.2 rounded font-mono">v3.0 Live</span>
          </div>
          <span id="userBadge" class="text-[11px] text-slate-400 font-mono"></span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openPollModal()" class="px-2.5 py-1.5 bg-[#121722] hover:bg-[#1B2334] border border-[#222B3E] rounded-xl text-xs font-semibold text-emerald-400">📊 Poll</button>
        <button onclick="startVideoCall()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-lg shadow-indigo-600/30">📹 Live Call</button>
        <button onclick="logout()" class="px-2.5 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-semibold">Exit</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-[#161C28] bg-[#0C1017] text-xs font-bold uppercase tracking-wider">
      <button id="tabChatBtn" onclick="switchTab('chat')" class="flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400">💬 Realtime Channels</button>
      <button id="tabFeedBtn" onclick="switchTab('feed')" class="flex-1 py-3 text-center text-slate-400 hover:text-white border-b-2 border-transparent">⚡ Community Pulse</button>
    </div>

    <!-- VIEW 1: LIVE CHAT & CALLS -->
    <div id="chatView" class="flex-1 flex flex-col md:flex-row overflow-hidden h-[calc(100vh-105px)]">
      
      <!-- Channels Sidebar -->
      <aside class="w-full md:w-60 border-b md:border-b-0 md:border-r border-[#161C28] bg-[#0C1017]/70 p-3 flex md:flex-col gap-1.5 overflow-x-auto md:overflow-y-auto">
        <div class="text-[10px] font-bold uppercase text-slate-500 px-2 py-1 hidden md:block">Rooms</div>
        <div id="roomListContainer" class="flex md:flex-col gap-1 w-full"></div>
      </aside>

      <!-- Chat Workspace -->
      <main class="flex-1 flex flex-col bg-[#080B10] overflow-hidden">
        <!-- Room Status & Typing Indicator Bar -->
        <div class="px-4 py-2 border-b border-[#161C28] bg-[#0E131C] flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-slate-500 font-mono">#</span>
            <span id="activeRoomTitle" class="font-bold text-sm text-white">general</span>
            <span id="typingIndicator" class="text-[11px] text-emerald-400 italic ml-2 hidden animate-pulse">someone is typing...</span>
          </div>
          <span class="text-[10px] text-slate-400">Bot: <code class="text-emerald-400 font-mono">/ai prompt</code></span>
        </div>

        <!-- Messages Stream -->
        <div id="messagesBox" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

        <!-- Quoted Reply Bar -->
        <div id="replyPreviewBar" class="hidden px-4 py-2 bg-[#121722] border-t border-[#20293B] flex items-center justify-between text-xs">
          <div class="flex items-center gap-2 truncate">
            <span class="text-emerald-400 font-bold">Replying to <span id="replyUserLabel"></span>:</span>
            <span id="replyTextLabel" class="text-slate-400 truncate italic"></span>
          </div>
          <button onclick="cancelReply()" class="text-slate-400 hover:text-white font-bold px-2">✕</button>
        </div>

        <!-- Chat Input Bar -->
        <div class="p-3 bg-[#0C1017] border-t border-[#161C28]">
          <div class="flex gap-2 items-center bg-[#131824] border border-[#222A3D] rounded-2xl px-3 py-1.5 focus-within:border-emerald-500 transition">
            <input id="chatInput" type="text" oninput="handleTyping()" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Message in #channel or /ai to ask bot..." class="w-full bg-transparent text-sm text-white placeholder-slate-500 outline-none py-1.5" />
            
            <div class="flex items-center gap-1.5">
              <!-- Voice Record Button -->
              <button id="recordBtn" onclick="toggleAudioRecording()" class="p-2 bg-[#1B2232] hover:bg-[#252E42] text-slate-300 hover:text-rose-400 rounded-xl transition" title="Voice Note">
                🎤
              </button>
              <button onclick="sendChatMessage()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl transition">Send</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- VIEW 2: FEED WITH COMMENTS DRAWER -->
    <main id="feedView" class="hidden p-4 space-y-4 flex-1 max-w-2xl mx-auto w-full">
      <div class="bg-[#0F141E] border border-[#1E2638] rounded-2xl p-4 shadow-xl">
        <textarea id="postContent" placeholder="Share a build update, launch, or code tip..." class="w-full bg-transparent text-sm text-white resize-none outline-none h-20 placeholder-slate-500"></textarea>
        <div class="flex items-center justify-between pt-3 border-t border-[#182030]">
          <div class="flex gap-1.5 text-xs text-slate-400">
            <button onclick="addHashtag('#build')" class="px-2 py-0.5 bg-[#141A26] rounded hover:text-emerald-400">#build</button>
            <button onclick="addHashtag('#showcase')" class="px-2 py-0.5 bg-[#141A26] rounded hover:text-emerald-400">#showcase</button>
            <button onclick="addHashtag('#ask')" class="px-2 py-0.5 bg-[#141A26] rounded hover:text-emerald-400">#ask</button>
          </div>
          <button onclick="publishPost()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-xl transition">Publish Pulse</button>
        </div>
      </div>
      <div id="postsList" class="space-y-4"></div>
    </main>
  </div>

  <!-- WEBRTC AUDIO/VIDEO CALL MODAL -->
  <div id="callModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4 z-50">
    <div class="w-full max-w-3xl bg-[#0F141E] border border-[#20293B] rounded-3xl overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 border-b border-[#20293B] flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
          <span class="font-bold text-sm text-white">Live Call Room</span>
        </div>
        <button onclick="endCall()" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs">Hang Up</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 p-4 bg-black/60 min-h-[300px]">
        <div class="relative bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
          <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
          <span class="absolute bottom-2 left-2 text-[10px] bg-black/60 px-2 py-1 rounded text-white font-mono">You (Local)</span>
        </div>
        <div class="relative bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
          <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
          <span class="absolute bottom-2 left-2 text-[10px] bg-black/60 px-2 py-1 rounded text-white font-mono">Peer (Live)</span>
        </div>
      </div>

      <div class="p-3 bg-[#0A0E15] border-t border-[#1C2434] flex items-center justify-center gap-3">
        <button onclick="toggleAudioTrack()" id="muteMicBtn" class="px-3 py-2 bg-[#161C28] hover:bg-[#202838] rounded-xl text-xs font-semibold">🎙️ Mute</button>
        <button onclick="toggleVideoTrack()" id="camToggleBtn" class="px-3 py-2 bg-[#161C28] hover:bg-[#202838] rounded-xl text-xs font-semibold">📷 Cam Off</button>
        <button onclick="shareScreen()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold">🖥️ Share Screen</button>
      </div>
    </div>
  </div>

  <!-- POLL CREATOR MODAL -->
  <div id="pollModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-[#0F141E] border border-[#20293B] p-6 rounded-2xl w-full max-w-sm shadow-2xl">
      <h3 class="text-sm font-bold text-white mb-2">Create Live Poll</h3>
      <input id="pollQuestion" type="text" placeholder="Poll Question..." class="w-full p-2.5 bg-[#161C2A] border border-[#242D40] rounded-xl text-xs text-white mb-2 outline-none" />
      <input id="pollOpt1" type="text" placeholder="Option 1" class="w-full p-2 bg-[#161C2A] border border-[#242D40] rounded-xl text-xs text-white mb-2 outline-none" />
      <input id="pollOpt2" type="text" placeholder="Option 2" class="w-full p-2 bg-[#161C2A] border border-[#242D40] rounded-xl text-xs text-white mb-4 outline-none" />
      <div class="flex gap-2">
        <button onclick="closePollModal()" class="flex-1 py-2 bg-[#161C28] rounded-xl text-xs font-bold">Cancel</button>
        <button onclick="submitPoll()" class="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl text-xs font-bold">Post Poll</button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = "https://tynoyujftmziutiytgsa.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5bm95dWpmdG16aXV0aXl0Z3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjE3MzQsImV4cCI6MjEwNjIzNzczNH0.71VfM08bzaxu__Idm3sp00VHzly9CSss9WwA-l5Fd5g";
    const GEMINI_API_KEY = "AQ.Ab8RN6KmhHgTqYsFFa3GqzljV1ZToW6k4xNjgBaLLllE8G52BA";

    const sb = supabase.createClient(SB_URL, SB_KEY);

    let currentUser = null;
    let currentRoom = "general";
    let chatChannel = null;
    let activeReply = null;
    let typingTimeout = null;

    // WebRTC Variables
    let peerConnection = null;
    let localStream = null;
    let callBroadcastChannel = null;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    // Voice Note Recorder Variables
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const availableRooms = ["general", "voice-lounge", "showcase", "dev-help", "ai-chat"];

    async function init() {
      checkSession();
    }

    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        showApp();
      } else {
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("mainApp").classList.add("hidden");
      }
    }

    async function handleAuth(type) {
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPass").value.trim();
      const msg = document.getElementById("authMsg");

      if (!email || !password) return msg.innerText = "Email & password required";
      msg.innerText = "Connecting...";

      try {
        let res = type === 'signup' 
          ? await sb.auth.signUp({ email, password })
          : await sb.auth.signInWithPassword({ email, password });

        if (res.error) throw res.error;
        if (res.data?.user) {
          currentUser = res.data.user;
          msg.innerText = "";
          showApp();
        }
      } catch (err) {
        msg.innerText = err.message;
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.reload();
    }

    function showApp() {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      document.getElementById("userBadge").innerText = `@${currentUser.email.split('@')[0]}`;
      renderRoomList();
      joinChatRoom("general");
      loadPosts();
      setupRealtimePosts();
      setupSignaling();
    }

    function switchTab(tab) {
      const feed = document.getElementById("feedView");
      const chat = document.getElementById("chatView");
      const feedBtn = document.getElementById("tabFeedBtn");
      const chatBtn = document.getElementById("tabChatBtn");

      if (tab === 'feed') {
        feed.classList.remove("hidden");
        chat.classList.add("hidden");
        feedBtn.className = "flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400";
        chatBtn.className = "flex-1 py-3 text-center text-slate-400 hover:text-white border-b-2 border-transparent";
      } else {
        feed.classList.add("hidden");
        chat.classList.remove("hidden");
        chatBtn.className = "flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400";
        feedBtn.className = "flex-1 py-3 text-center text-slate-400 hover:text-white border-b-2 border-transparent";
      }
    }

    // --- CHAT ROOMS & MESSAGING ---
    function renderRoomList() {
      const container = document.getElementById("roomListContainer");
      container.innerHTML = availableRooms.map(r => `
        <button onclick="joinChatRoom('${r}')" class="px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 whitespace-nowrap transition ${currentRoom === r ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-[#141A26]'}">
          <span class="text-slate-500">#</span>
          <span>${r}</span>
        </button>
      `).join('');
    }

    async function joinChatRoom(room) {
      currentRoom = room;
      cancelReply();
      document.getElementById("activeRoomTitle").innerText = room;
      renderRoomList();

      const box = document.getElementById("messagesBox");
      box.innerHTML = `<div class="text-[11px] text-center text-slate-500 py-3">Connected to #${room}</div>`;

      const { data } = await sb.from('messages').select('*').eq('room_id', room).order('created_at', { ascending: true }).limit(60);
      if (data) data.forEach(m => appendChatMessage(m));

      if (chatChannel) sb.removeChannel(chatChannel);

      chatChannel = sb.channel(`room-${room}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${room}` }, payload => {
          appendChatMessage(payload.new);
        })
        .on('broadcast', { event: 'typing' }, payload => {
          if (payload.payload.user !== currentUser.email.split('@')[0]) {
            const ind = document.getElementById("typingIndicator");
            ind.innerText = `@${payload.payload.user} is typing...`;
            ind.classList.remove("hidden");
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => ind.classList.add("hidden"), 2000);
          }
        })
        .subscribe();
    }

    function handleTyping() {
      if (chatChannel) {
        chatChannel.send({
          type: 'broadcast',
          event: 'typing',
          payload: { user: currentUser.email.split('@')[0] }
        });
      }
    }

    function parsePayload(raw) {
      try {
        const obj = JSON.parse(raw);
        if (typeof obj === 'object') return obj;
      } catch (e) {}
      return { text: raw, type: 'text' };
    }

    function appendChatMessage(m) {
      const box = document.getElementById("messagesBox");
      const isMe = m.user_email === currentUser.email;
      const isAI = m.user_email === 'pulse-ai@system';
      const sender = isAI ? 'PulseBot (AI)' : (m.user_email?.split('@')[0] || 'dev');
      const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const data = parsePayload(m.message);

      const msgEl = document.createElement("div");
      msgEl.className = `flex flex-col group ${isMe ? 'items-end' : 'items-start'}`;

      let replyHtml = '';
      if (data.reply) {
        replyHtml = `
          <div class="mb-1 text-[11px] px-2 py-0.5 bg-black/40 border-l-2 border-emerald-400 rounded text-slate-400">
            <span class="text-emerald-400 font-mono">↳ @${data.reply.user}:</span> ${data.reply.text}
          </div>
        `;
      }

      let contentHtml = '';
      if (data.type === 'audio') {
        contentHtml = `
          <div class="flex items-center gap-2">
            <audio controls src="${data.audio}" class="h-8 w-48 sm:w-60"></audio>
          </div>
        `;
      } else if (data.type === 'poll') {
        contentHtml = `
          <div class="space-y-2 p-1">
            <div class="font-bold text-xs text-white">📊 ${data.question}</div>
            <button onclick="votePoll(${m.id}, 1)" class="w-full text-left px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs hover:border-emerald-500">${data.opt1} <span class="float-right font-mono">${data.votes1 || 0}</span></button>
            <button onclick="votePoll(${m.id}, 2)" class="w-full text-left px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs hover:border-emerald-500">${data.opt2} <span class="float-right font-mono">${data.votes2 || 0}</span></button>
          </div>
        `;
      } else {
        let txt = (data.text || '').replace(/@([a-zA-Z0-9_-]+)/g, '<span class="text-emerald-400 font-semibold">@$1</span>');
        contentHtml = `<div class="leading-relaxed break-words">${txt}</div>`;
      }

      msgEl.innerHTML = `
        <div class="flex items-center gap-2 mb-0.5 px-1">
          <span class="text-[11px] font-bold ${isAI ? 'text-indigo-400 font-mono' : 'text-slate-400'}">${sender}</span>
          <span class="text-[9px] text-slate-600 font-mono">${time}</span>
        </div>
        <div class="relative max-w-sm sm:max-w-md">
          <div class="px-3.5 py-2 rounded-2xl text-xs ${isAI ? 'bg-indigo-950 border border-indigo-700/60 text-indigo-100' : (isMe ? 'bg-emerald-600 text-white rounded-tr-none' : 'bg-[#141A26] border border-[#222A3D] text-slate-200 rounded-tl-none')} shadow">
            ${replyHtml}
            ${contentHtml}
          </div>
          ${!isAI ? `
            <div class="absolute -bottom-2 ${isMe ? 'left-0' : 'right-0'} opacity-0 group-hover:opacity-100 flex items-center bg-[#0C1017] border border-[#222A3D] px-1.5 py-0.5 rounded-full shadow text-[10px]">
              <button onclick="startReply('${sender}', \`${(data.text || 'media').substring(0, 35)}\`)" class="text-slate-400 hover:text-emerald-400 px-1">↩</button>
            </div>
          ` : ''}
        </div>
      `;
      box.appendChild(msgEl);
      box.scrollTop = box.scrollHeight;
    }

    function startReply(user, text) {
      activeReply = { user, text };
      document.getElementById("replyUserLabel").innerText = `@${user}`;
      document.getElementById("replyTextLabel").innerText = `"${text}..."`;
      document.getElementById("replyPreviewBar").classList.remove("hidden");
      document.getElementById("chatInput").focus();
    }
    function cancelReply() {
      activeReply = null;
      document.getElementById("replyPreviewBar").classList.add("hidden");
    }

    async function sendChatMessage() {
      const inp = document.getElementById("chatInput");
      const text = inp.value.trim();
      if (!text) return;
      inp.value = "";

      const reply = activeReply;
      cancelReply();

      // Check for Gemini AI Command (/ai)
      if (text.startsWith("/ai ")) {
        const query = text.replace("/ai ", "").trim();
        // Insert user prompt first
        await sb.from('messages').insert([{
          room_id: currentRoom,
          user_email: currentUser.email,
          message: JSON.stringify({ text, reply, type: 'text' })
        }]);

        // Call Gemini
        callGeminiBot(query);
        return;
      }

      await sb.from('messages').insert([{
        room_id: currentRoom,
        user_email: currentUser.email,
        message: JSON.stringify({ text, reply, type: 'text' })
      }]);
    }

    // --- GEMINI IN-CHAT AI BOT ---
    async function callGeminiBot(promptText) {
      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro-latest:generateContent?key=${GEMINI_API_KEY}`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Answer concisely as Pulse AI software bot: ${promptText}` }] }]
          })
        });
        const data = await res.json();
        const aiAnswer = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't generate an answer.";

        await sb.from('messages').insert([{
          room_id: currentRoom,
          user_email: 'pulse-ai@system',
          message: JSON.stringify({ text: aiAnswer, type: 'text' })
        }]);
      } catch (err) {
        console.error("Gemini Bot Error:", err);
      }
    }

    // --- AUDIO VOICE NOTES (WhatsApp Style) ---
    async function toggleAudioRecording() {
      const btn = document.getElementById("recordBtn");
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
              const base64Audio = reader.result;
              await sb.from('messages').insert([{
                room_id: currentRoom,
                user_email: currentUser.email,
                message: JSON.stringify({ audio: base64Audio, type: 'audio' })
              }]);
            };
          };

          mediaRecorder.start();
          isRecording = true;
          btn.innerText = "🛑 Stop";
          btn.className = "p-2 bg-rose-600 text-white rounded-xl animate-pulse";
        } catch (e) {
          alert("Microphone permission denied or unsupported.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.innerText = "🎤";
        btn.className = "p-2 bg-[#1B2232] text-slate-300 rounded-xl";
      }
    }

    // --- INTERACTIVE POLLS (Telegram Style) ---
    function openPollModal() { document.getElementById("pollModal").classList.remove("hidden"); }
    function closePollModal() { document.getElementById("pollModal").classList.add("hidden"); }

    async function submitPoll() {
      const q = document.getElementById("pollQuestion").value.trim();
      const o1 = document.getElementById("pollOpt1").value.trim();
      const o2 = document.getElementById("pollOpt2").value.trim();
      if (!q || !o1 || !o2) return alert("Fill question and both options");

      closePollModal();
      document.getElementById("pollQuestion").value = "";
      document.getElementById("pollOpt1").value = "";
      document.getElementById("pollOpt2").value = "";

      await sb.from('messages').insert([{
        room_id: currentRoom,
        user_email: currentUser.email,
        message: JSON.stringify({
          type: 'poll',
          question: q,
          opt1: o1,
          opt2: o2,
          votes1: 0,
          votes2: 0
        })
      }]);
    }

    async function votePoll(messageId, optNum) {
      const { data } = await sb.from('messages').select('message').eq('id', messageId).single();
      if (!data) return;
      let payload = parsePayload(data.message);
      if (optNum === 1) payload.votes1 = (payload.votes1 || 0) + 1;
      if (optNum === 2) payload.votes2 = (payload.votes2 || 0) + 1;

      await sb.from('messages').update({ message: JSON.stringify(payload) }).eq('id', messageId);
      joinChatRoom(currentRoom);
    }

    // --- WEBRTC CALLING & SCREEN SHARE (Discord Style) ---
    function setupSignaling() {
      callBroadcastChannel = sb.channel('pulse-signaling')
        .on('broadcast', { event: 'call-signal' }, async payload => {
          const { sender, data } = payload.payload;
          if (sender === currentUser.email) return;

          if (data.type === 'offer') {
            const accept = confirm(`Incoming call from @${sender.split('@')[0]}. Join?`);
            if (accept) {
              document.getElementById("callModal").classList.remove("hidden");
              await initPeerConnection();
              await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
              const answer = await peerConnection.createAnswer();
              await peerConnection.setLocalDescription(answer);
              sendSignal({ type: 'answer', answer });
            }
          } else if (data.type === 'answer') {
            if (peerConnection) {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
          } else if (data.type === 'candidate') {
            if (peerConnection && data.candidate) {
              try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
            }
          } else if (data.type === 'hangup') {
            endCall(false);
          }
        }).subscribe();
    }

    function sendSignal(data) {
      if (callBroadcastChannel) {
        callBroadcastChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: { sender: currentUser.email, data }
        });
      }
    }

    async function startVideoCall() {
      document.getElementById("callModal").classList.remove("hidden");
      await initPeerConnection();
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      sendSignal({ type: 'offer', offer });
    }

    async function initPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById("localVideo").srcObject = localStream;

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = e => {
        document.getElementById("remoteVideo").srcObject = e.streams[0];
      };

      peerConnection.onicecandidate = e => {
        if (e.candidate) sendSignal({ type: 'candidate', candidate: e.candidate });
      };
    }

    function toggleAudioTrack() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("muteMicBtn").innerText = track.enabled ? "🎙️ Mute" : "🔇 Unmuted";
      }
    }

    function toggleVideoTrack() {
      if (!localStream) return;
      const track = localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("camToggleBtn").innerText = track.enabled ? "📷 Cam Off" : "📷 Cam On";
      }
    }

    async function shareScreen() {
      try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const screenTrack = screenStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
        if (sender) sender.replaceTrack(screenTrack);
        document.getElementById("localVideo").srcObject = screenStream;
        screenTrack.onended = () => {
          const origTrack = localStream.getVideoTracks()[0];
          if (sender) sender.replaceTrack(origTrack);
          document.getElementById("localVideo").srcObject = localStream;
        };
      } catch (e) {}
    }

    function endCall(sendBroadcast = true) {
      if (sendBroadcast) sendSignal({ type: 'hangup' });
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById("callModal").classList.add("hidden");
    }

    // --- COMMUNITY FEED & COMMENTS DRAWER (Twitter Style) ---
    function addHashtag(tag) {
      const el = document.getElementById("postContent");
      el.value = el.value + " " + tag;
      el.focus();
    }

    async function loadPosts() {
      const { data } = await sb.from('posts').select('*').order('created_at', { ascending: false }).limit(30);
      renderPosts(data || []);
    }

    function renderPosts(posts) {
      const list = document.getElementById("postsList");
      if (posts.length === 0) {
        list.innerHTML = `<div class="text-xs text-center text-slate-500 py-10">No pulses found.</div>`;
        return;
      }

      list.innerHTML = posts.map(p => {
        const sender = p.user_email?.split('@')[0] || 'dev';
        const time = new Date(p.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const likes = p.likes || 0;
        let formatted = p.content.replace(/#([a-zA-Z0-9_-]+)/g, '<span class="text-emerald-400 font-semibold">#$1</span>');

        return `
          <article class="bg-[#0F141E] border border-[#1E2638] p-4 rounded-2xl shadow">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs uppercase">${sender[0]}</div>
                <div>
                  <span class="text-xs font-bold text-white">@${sender}</span>
                  <span class="text-[10px] text-slate-500 block font-mono">${time}</span>
                </div>
              </div>
              <button onclick="likePost(${p.id}, ${likes})" class="flex items-center gap-1.5 px-2.5 py-1 bg-[#161C28] hover:bg-[#202838] border border-[#242D40] rounded-xl text-xs font-semibold text-rose-400">
                <span>❤️</span> <span>${likes}</span>
              </button>
            </div>
            <p class="text-sm text-slate-200 leading-relaxed mb-3 break-words">${formatted}</p>

            <!-- Thread Comments Toggle -->
            <div class="pt-2 border-t border-[#182030] flex items-center justify-between">
              <button onclick="toggleComments(${p.id})" class="text-xs text-slate-400 hover:text-emerald-400 flex items-center gap-1 font-semibold">
                💬 Comments Thread
              </button>
            </div>

            <!-- Comments Drawer -->
            <div id="comments-${p.id}" class="hidden mt-3 pt-3 border-t border-[#182030] space-y-2">
              <div id="commentList-${p.id}" class="space-y-1.5 text-xs text-slate-300"></div>
              <div class="flex gap-2 pt-1">
                <input id="commentInp-${p.id}" type="text" placeholder="Write a comment..." class="flex-1 p-2 bg-[#161C28] border border-[#242D40] rounded-xl text-xs text-white outline-none" />
                <button onclick="submitComment(${p.id})" class="px-3 bg-emerald-500 text-slate-950 rounded-xl text-xs font-bold">Post</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function publishPost() {
      const txt = document.getElementById("postContent").value.trim();
      if (!txt) return;
      await sb.from('posts').insert([{ content: txt, user_email: currentUser.email, likes: 0 }]);
      document.getElementById("postContent").value = "";
      loadPosts();
    }

    async function likePost(id, currentLikes) {
      await sb.from('posts').update({ likes: currentLikes + 1 }).eq('id', id);
      loadPosts();
    }

    async function toggleComments(postId) {
      const drawer = document.getElementById(`comments-${postId}`);
      drawer.classList.toggle("hidden");
      if (!drawer.classList.contains("hidden")) {
        loadComments(postId);
      }
    }

    async function loadComments(postId) {
      const box = document.getElementById(`commentList-${postId}`);
      const { data } = await sb.from('messages').select('*').eq('room_id', `post_${postId}`).order('created_at', { ascending: true });
      if (data && data.length > 0) {
        box.innerHTML = data.map(c => `
          <div class="p-2 bg-[#141A26] rounded-xl flex items-center justify-between">
            <span class="text-slate-300"><b class="text-emerald-400">@${c.user_email.split('@')[0]}:</b> ${c.message}</span>
            <span class="text-[9px] text-slate-500 font-mono">${new Date(c.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
        `).join('');
      } else {
        box.innerHTML = `<span class="text-[11px] text-slate-500">No comments yet. Be first!</span>`;
      }
    }

    async function submitComment(postId) {
      const inp = document.getElementById(`commentInp-${postId}`);
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = "";
      await sb.from('messages').insert([{
        room_id: `post_${postId}`,
        user_email: currentUser.email,
        message: txt
      }]);
      loadComments(postId);
    }

    function setupRealtimePosts() {
      sb.channel('realtime-feed-updates')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
          loadPosts();
        }).subscribe();
    }

    window.onload = init;
  </script>
</body>
</html>
